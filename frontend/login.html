<!doctype html>
<html lang="pt-BR">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Entrar · BoraObra</title>
  <link rel="icon" href="/static/img/favicon.svg?v=20260922" type="image/svg+xml" />
  <script src="/static/js/theme-init.js"></script>
  <link rel="stylesheet" href="/static/css/tokens.css" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
  <link rel="stylesheet" href="/static/css/style.css?v=20260922-9" />
</head>

<body class="bg-dark" data-area="auth" data-page="login">
  <a class="skip-link" href="#conteudo-principal">Pular para o conteúdo</a>
  <div id="notifications" class="notifications" aria-live="polite"></div>
  <div id="app-shell"></div>
  <main id="conteudo-principal" class="auth-overlay">
    <section class="auth-card" aria-labelledby="login-title">
      <div class="auth-brand-panel">
        <i class="fa-solid fa-helmet-safety"></i>
        <h1>BoraObra</h1>
        <p>
          Encontre ferramentas perto de você ou cuide da sua loja em um só
          lugar.
        </p>
      </div>
      <div class="auth-form-panel">
        <div class="auth-heading">
          <div>
            <span class="eyebrow">Boas-vindas</span>
            <h2 id="login-title">Entre na sua conta</h2>
            <p>Use o e-mail e a senha cadastrados.</p>
          </div>
        </div>
        <form id="form-login" novalidate>
          <div class="input-group">
            <label for="login-email">E-mail</label><input type="email" id="login-email" autocomplete="email"
              placeholder="seu@email.com" required /><small class="field-error" id="login-email-error"></small>
          </div>
          <div class="input-group">
            <label for="login-senha">Senha</label>
            <div class="password-field">
              <input type="password" id="login-senha" autocomplete="current-password" placeholder="Digite sua senha"
                required /><button type="button" data-action="senha-toggle" data-target="login-senha"
                aria-label="Mostrar senha">
                <i class="fa-regular fa-eye"></i>
              </button>
            </div>
            <small class="field-error" id="login-senha-error"></small>
          </div>
          <div id="auth-erro" class="auth-erro hidden" role="alert"></div>
          <button type="submit" class="btn-primary">
            <span>Entrar</span>
          </button>
        </form>
        <p class="auth-switch">
          Ainda não tem conta? <a href="/cadastro.html">Criar minha conta</a>
        </p>
      </div>
    </section>
  </main>
  <script type="module" src="/static/js/main.js?v=20260922-9"></script>
</body>

</html>
